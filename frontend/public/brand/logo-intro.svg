<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 528" role="img" aria-labelledby="fh-title">
  <title id="fh-title">FilamentHub — Smart. Seamless. Spool.</title>
  <!--
    Logo intro animation (plays once, ~4 s):
    1) the ring pops in and gets "pressed" like a button, sending out a ripple;
    2) the F and H letters are drawn inside;
    3) the filament wraps around the ring and flicks out its tail;
    4) the tagline fades in word by word.
    Geometry matches /logo.svg; the filament reveals the original filled shape
    through a mask, so the final frame is identical to the static logo.
  -->
  <style>
    .ink { fill: none; stroke: #e6dede; stroke-linecap: round; }
    .grow { transform-box: fill-box; transform-origin: center; }
    .draw { stroke-dasharray: 1 2; stroke-dashoffset: 1; animation: fh-draw var(--d) cubic-bezier(.6, 0, .3, 1) var(--t) both; }

    #ring { animation: fh-press .95s cubic-bezier(.3, 0, .2, 1) .1s both; }
    #ring-glow { animation: fh-glow .9s ease-out .38s both; }
    #ripple { animation: fh-ripple .9s cubic-bezier(.2, .6, .3, 1) .55s both; }
    #wrap { animation-timing-function: cubic-bezier(.5, 0, .25, 1); }
    #tagline { animation: fh-rise .8s cubic-bezier(.2, .7, .3, 1) 3.15s both; }
    #tagline tspan { animation: fh-fade .55s ease-out var(--t) both; }

    @keyframes fh-draw {
      0% { stroke-dashoffset: 1; opacity: 0; }
      1% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes fh-press {
      0% { transform: scale(.2); opacity: 0; }
      30% { transform: scale(1.08); opacity: 1; }
      52% { transform: scale(.86); }
      74% { transform: scale(1.03); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fh-glow {
      0% { transform: scale(.6); opacity: 0; }
      30% { transform: scale(.9); opacity: .22; }
      100% { transform: scale(1); opacity: 0; }
    }
    @keyframes fh-ripple {
      0% { transform: scale(1); opacity: .55; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    @keyframes fh-rise {
      from { transform: translateY(14px); }
      to { transform: translateY(0); }
    }
    @keyframes fh-fade {
      from { fill-opacity: 0; }
      to { fill-opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, #tagline tspan { animation: none !important; }
      .draw { stroke-dashoffset: 0; }
      #ring-glow, #ripple { opacity: 0; }
    }
  </style>

  <defs>
    <mask id="fh-wrap-mask" maskUnits="userSpaceOnUse" x="-30" y="-30" width="420" height="350">
      <path id="wrap" class="draw" style="--t: 1.95s; --d: 1.45s" pathLength="1"
            fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"
            d="M353.0 188.2 352.0 191.5 351.0 194.9 349.9 198.3 348.9 201.7 347.6 205.0 346.2 208.2 344.4 211.2 342.4 214.1 340.2 216.9 337.7 219.4 335.0 221.6 332.0 223.6 328.9 225.2 325.7 226.6 322.4 227.8 318.9 228.6 315.5 229.1 311.9 229.3 308.4 229.2 304.9 228.7 301.5 227.9 298.1 226.8 294.9 225.4 291.8 223.8 288.9 221.8 286.1 219.6 283.6 217.1 281.3 214.5 279.3 211.6 277.5 208.5 276.0 205.3 274.8 202.0 274.0 198.6 273.4 195.1 273.2 191.6 273.2 188.1 273.5 184.5 274.0 181.1 274.5 177.6 275.2 174.1 275.8 170.6 276.4 167.2 276.9 163.7 277.4 160.2 277.8 156.7 278.0 153.2 278.3 149.6 278.4 146.1 278.4 142.6 278.3 139.1 278.2 135.5 277.9 132.0 277.6 128.5 277.1 125.0 276.6 121.5 276.0 118.0 275.3 114.6 274.5 111.2 273.6 107.8 272.6 104.4 271.5 101.0 270.3 97.7 269.1 94.4 267.8 91.1 266.3 87.9 264.8 84.7 263.2 81.6 261.6 78.4 259.8 75.4 258.0 72.4 256.1 69.4 254.1 66.5 252.0 63.6 249.9 60.8 247.7 58.1 245.4 55.4 243.0 52.8 240.6 50.2 238.1 47.7 235.6 45.3 233.0 42.9 230.3 40.6 227.6 38.3 224.8 36.2 222.0 34.1 219.1 32.0 216.2 30.1 213.2 28.2 210.2 26.4 207.1 24.7 204.0 23.0 200.8 21.4 197.6 19.9 194.4 18.5 191.1 17.2 187.8 16.0 184.5 14.8 181.1 13.8 177.7 12.8 174.3 11.9 170.9 11.1 167.4 10.4 164.0 9.8 160.5 9.3 157.0 8.8 153.5 8.5 149.9 8.3 146.4 8.1 142.9 8.1 139.4 8.1 135.8 8.3 132.3 8.5 128.8 8.8 125.3 9.3 121.8 9.8 118.4 10.4 114.9 11.1 111.5 11.9 108.1 12.8 104.7 13.7 101.3 14.8 98.0 16.0 94.7 17.2 91.4 18.5 88.2 19.9 85.0 21.4 81.8 23.0 78.7 24.7 75.6 26.4 72.6 28.2 69.6 30.1 66.7 32.1 63.8 34.1 61.0 36.2 58.3 38.4 55.6 40.7 52.9 43.0 50.3 45.4 47.8 47.9 45.4 50.4 43.0 53.0 40.7 55.7 38.4 58.4 36.3 61.2 34.1 64.0 32.1 66.9 30.2 69.8 28.3 72.8 26.5 75.8 24.8 78.9 23.1 82.0 21.5 85.2 20.0 88.4 18.6 91.6 17.3 94.9 16.1 98.2 14.9 101.5 13.9 104.9 12.9 108.3 12.0 111.7 11.2 115.1 10.5 118.6 9.8 122.0 9.3 125.5 8.9 129.0 8.5 132.5 8.2 136.1 8.1 139.6 8.0 143.1 8.0 146.6 8.1 150.2 8.3 153.7 8.6 157.2 9.0 160.7 9.4 164.2 10.0 167.7 10.6 171.1 11.3 174.6 12.1 178.0 13.0 181.4 14.0 184.8 15.0 188.2 16.2 191.5 17.4 194.8 18.7 198.1 20.2 201.3 21.6 204.5 23.2 207.7 24.9 210.8 26.6 213.9 28.4 216.9 30.3 219.8 32.3 222.8 34.4 225.6 36.5 228.4 38.7 231.2 41.0 233.9 43.3 236.5 45.7 239.1 48.2 241.6 50.8 244.0 53.4 246.4 56.0 248.7 58.8 251.0 61.5 253.1 64.4 255.2 67.3 257.2 70.2 259.2 73.2 261.1 76.2 262.9 79.3 264.6 82.4 266.2 85.6 267.7 88.8 269.2 92.1 270.6 95.3 271.9 98.6 273.2 102.0 274.3 105.3 275.4 108.7 276.3 112.1 277.2 115.6 278.0 119.0 278.7 122.5 279.3 126.0 279.9 129.5 280.3 133.0 280.6 136.5 280.9 140.0 281.1 143.6 281.1 147.1 281.1 150.6 281.0 154.1 280.7 157.6 280.4 161.1 280.0 164.6 279.5 168.1 278.9 171.6 278.2 175.0 277.4 178.4 276.6 181.8 275.6 185.2 274.5 188.5 273.4 191.8 272.1 195.1 270.8 198.3 269.4 201.5 267.9 204.7 266.3 207.8 264.7 210.8 262.9 213.9 261.1 216.8 259.2 219.8 257.3 222.6 255.2 225.5 253.1 228.2 250.9 231.0 248.7 233.7 246.5 236.4 244.3"/>
    </mask>
  </defs>

  <g transform="translate(256.4 75.3)">
    <!-- 1. ring: the "button" -->
    <circle id="ring-glow" class="grow" cx="143.32" cy="144.72" r="89.57" fill="#e6dede"/>
    <circle id="ripple" class="grow ink" cx="143.32" cy="144.72" r="97.57" stroke-width="4"/>
    <circle id="ring" class="grow ink" cx="143.32" cy="144.72" r="97.57" stroke-width="16"/>

    <!-- 2. letters F and H -->
    <g class="ink">
      <path class="draw" style="--t: 1s; --d: .5s" pathLength="1" stroke-width="16"
            d="M129.76 84.07 A62.16 62.16 0 0 0 91.52 179.11"/>
      <path class="draw" style="--t: 1.3s; --d: .3s" pathLength="1" stroke-width="16"
            d="M89.2 144.72 H129.62"/>
      <path class="draw" style="--t: 1.4s; --d: .4s" pathLength="1" stroke-width="18"
            d="M151.25 83.76 L151.4 205.32"/>
      <path class="draw" style="--t: 1.62s; --d: .25s" pathLength="1" stroke-width="18"
            d="M151.3 144.72 H197.3"/>
      <path class="draw" style="--t: 1.5s; --d: .5s" pathLength="1" stroke-width="16"
            d="M197.14 113.85 A62.02 62.02 0 0 1 194.95 179.1"/>
    </g>

    <!-- 3. filament wrapping around -->
    <path fill="#e6dede" mask="url(#fh-wrap-mask)" d="M144.15,289.05c-20.28,0-40.54-4.37-59.39-12.88-23.87-10.78-44.3-27.66-59.09-48.83C9.93,204.81,1.09,177.89.11,149.5-1.98,96.81,26.11,45.75,71.67,19.46,96.19,5.22,123.66-1.42,151.11.25c25.66,1.57,50.71,10.25,72.42,25.12,46.3,31.69,69.71,85.55,61.1,140.6-.41,3.03-.96,6.05-1.5,8.96-1.51,8.22-2.93,15.98-1.07,23.11l.04.14c2.18,9.05,8.87,16.95,17.45,20.6l.12.05c12.35,5.51,28.27,1.4,36.26-9.36l.14-.18c3.3-4.18,5.21-9.8,6.65-14.74,1.24-4.24,5.67-6.68,9.92-5.44,4.24,1.23,6.68,5.67,5.44,9.92-1.86,6.39-4.43,13.77-9.38,20.08-12.49,16.71-36.31,22.88-55.49,14.36-13.29-5.68-23.24-17.44-26.65-31.48-2.72-10.53-.83-20.85.84-29.95.53-2.88,1.03-5.61,1.39-8.29l.03-.18c7.68-48.92-13.13-96.81-54.32-125-40.75-27.88-92.4-29.9-134.81-5.27C39.19,56.68,14.24,102.05,16.1,148.9c1.7,49.34,30.54,92.5,75.25,112.69,45.01,20.32,94.75,13.66,133.04-17.82,3.41-2.8,8.46-2.31,11.26,1.1,2.81,3.41,2.31,8.46-1.1,11.26-21.79,17.91-47.62,28.99-74.7,32.04-5.22.59-10.46.88-15.7.88Z"/>
  </g>

  <!-- 4. tagline -->
  <text id="tagline" x="407" y="468" text-anchor="middle" fill="#e6dede"
        font-family="Arial, 'Helvetica Neue', Helvetica, 'Liberation Sans', sans-serif"
        font-size="64" textLength="661" lengthAdjust="spacing">
    <tspan style="--t: 3.2s">Smart.</tspan> <tspan style="--t: 3.45s">Seamless.</tspan> <tspan style="--t: 3.7s">Spool.</tspan>
  </text>
</svg>
