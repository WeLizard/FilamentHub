map "$uri|$arg_lng" $filamenthub_spa_index {
    ~^/en(?:/|$) /index.en.html;
    ~^/ru(?:/|$) /index.ru.html;
    ~^/zh(?:/|$) /index.zh.html;
    ~^[^|]*\|en$ /index.en.html;
    ~^[^|]*\|ru$ /index.ru.html;
    ~^[^|]*\|zh$ /index.zh.html;
    default /index.x-default.html;
}

# Public pages also ship as static text (dist/_pages/<variant><path>/index.html,
# written by scripts/generate-localized-seo.mjs). These two values select the
# language variant and the page, following the same rules as the SPA shell.
map "$uri|$arg_lng" $filamenthub_static_root {
    ~^/en(?:/|$) /_pages/en;
    ~^/ru(?:/|$) /_pages/ru;
    ~^/zh(?:/|$) /_pages/zh;
    ~^[^|]*\|en$ /_pages/en;
    ~^[^|]*\|ru$ /_pages/ru;
    ~^[^|]*\|zh$ /_pages/zh;
    default /_pages/x-default;
}

map $uri $filamenthub_static_page {
    ~^/(?:en|ru|zh)?/?$ "";
    ~^/(?:en|ru|zh)(?<filamenthub_static_path>/.+)$ $filamenthub_static_path;
    default $uri;
}

map $request_uri $filamenthub_canonical_path {
    ~^(?<filamenthub_request_path>[^?]*) $filamenthub_request_path;
}

map $request_uri $filamenthub_base_path {
    ~^/(?:en|ru|zh)(?<filamenthub_unprefixed_path>/[^?]*) $filamenthub_unprefixed_path;
    ~^/(?:en|ru|zh)/?(?:\?|$) /;
    ~^(?<filamenthub_default_path>[^?]*) $filamenthub_default_path;
}

map $uri $filamenthub_without_en {
    default "";
    ~^/en/?$ /;
    ~^/en(?<filamenthub_en_path>/.*)/$ $filamenthub_en_path;
    ~^/en(?<filamenthub_en_path>/.*)$ $filamenthub_en_path;
}

map $uri $filamenthub_without_trailing_slash {
    default "";
    ~^(?<filamenthub_clean_web_path>/(?:(?:ru|zh)/)?(?:filaments/[0-9]+|brands/[^/]+(?:/filaments/[^/]+)?|profile|demo|calculator|feedback/[^/]+|workspace|admin|about|features|for-brands|download(?:/(?:octoprint|print-farm|edge))?|wiki(?:/articles/[^/]+|/[^/]+)?|embed(?:/catalog)?|user-agreement|privacy-policy|personal-data-consent|reset-password|confirm-email-change|brand-invite/[^/]+|oauth/callback/[^/]+|oauth/plugin-start/[^/]+|quote/[^/]+))/$ $filamenthub_clean_web_path;
}

map $request_uri $filamenthub_robots_tag {
    default "";
    ~^/(?:(?:en|ru|zh)/)?(?:profile|demo|calculator|workspace|admin)(?:/|\?|$) "noindex, nofollow";
    ~^/(?:(?:en|ru|zh)/)?(?:feedback/|quote/|reset-password|confirm-email-change|brand-invite/|oauth/|embed(?:/|\?|$)) "noindex, nofollow";
    ~^/(?:(?:en|ru|zh)/)?(?:user-agreement|privacy-policy|personal-data-consent)(?:/|\?|$) "noindex, nofollow";
}

# Named so a proxy_pass with a variable URI can reach it without a resolver.
upstream filamenthub_backend_dev {
    server backend-dev:8000;
}

server {
    listen 80;
    server_name localhost _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    if ($filamenthub_without_en != "") {
        return 301 $filamenthub_without_en$is_args$args;
    }

    if ($filamenthub_without_trailing_slash != "") {
        return 301 $filamenthub_without_trailing_slash$is_args$args;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    add_header X-Robots-Tag $filamenthub_robots_tag always;
    sub_filter '__FH_CANONICAL_PATH__' '$filamenthub_canonical_path';
    sub_filter '__FH_BASE_PATH__' '$filamenthub_base_path';
    sub_filter_once off;

    # Health checks (backend root endpoint)
    location = /health {
        proxy_pass http://backend-dev:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Compatibility alias for monitors that use /api/health
    location = /api/health {
        proxy_pass http://backend-dev:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API proxy to backend-dev
    location ^~ /api {
        proxy_pass http://backend-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-FilamentHub-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
    }

    # Spool compat proxy (clean path for Moonraker/HH integration)
    location ^~ /spool_compat {
        proxy_pass http://backend-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
    }

    location ^~ /uploads {
        proxy_pass http://backend-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location ^~ /qr_codes {
        proxy_pass http://backend-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /distributions {
        proxy_pass http://backend-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /wiki_content {
        proxy_pass http://backend-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass http://backend-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Serve the SPA only for routes that actually exist in React Router. Unknown
    # pages and files must keep a real HTTP 404 for crawler parity with production.
    location = / {
        try_files $filamenthub_static_root/index.html $filamenthub_spa_index =404;
        expires -1;
    }

    location ~ ^/(?:en|ru|zh)/?$ {
        try_files $filamenthub_static_root/index.html $filamenthub_spa_index =404;
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location = /_catalog_url_auth {
        internal;
        proxy_pass http://backend-dev:8000/api/v1/catalog-urls/resolve;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Catalogue and wiki pages are rendered by the backend so that readers
    # without JavaScript get each page's own title, description, canonical
    # address, alternates, structured data and text. A missing page keeps a
    # real 404 with the application's screen; if the backend fails, the plain
    # application shell stands in.
    location @filamenthub_spa_shell {
        try_files $filamenthub_spa_index =404;
        expires -1;
    }

    # Shell parts the build writes for the backend's pages; SSI only.
    location ^~ /_shell/ {
        internal;
    }

    location @catalog_canonical_redirect {
        return 301 $filamenthub_catalog_canonical_path$is_args$args;
    }

    location ~ ^/(?:(?:ru|zh)/)?(?:filaments/[0-9]+|brands/[^./]+(?:/filaments/[^./]+)?)$ {
        auth_request /_catalog_url_auth;
        auth_request_set $filamenthub_catalog_canonical_path $upstream_http_x_canonical_path;
        error_page 401 = @catalog_canonical_redirect;
        error_page 403 =404 @filamenthub_spa_shell;
        # The page comes from the backend as complete HTML with SSI includes
        # for the shell parts in /_shell/ (app/services/public_page_render.py).
        ssi on;
        set $filamenthub_render_uri /api/v1/public-pages/render;
        proxy_pass http://filamenthub_backend_dev$filamenthub_render_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSI reads the body, so it must arrive uncompressed.
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 404 =404 @filamenthub_spa_shell;
        error_page 500 502 503 504 = @filamenthub_spa_shell;
        expires -1;
    }

    location ~ ^/(?:(?:ru|zh)/)?wiki(?:/articles/[^./]+|/[^./]+)?$ {
        # The page comes from the backend as complete HTML with SSI includes
        # for the shell parts in /_shell/ (app/services/public_page_render.py).
        ssi on;
        set $filamenthub_render_uri /api/v1/public-pages/render;
        proxy_pass http://filamenthub_backend_dev$filamenthub_render_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSI reads the body, so it must arrive uncompressed.
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 404 =404 @filamenthub_spa_shell;
        error_page 500 502 503 504 = @filamenthub_spa_shell;
        expires -1;
    }

    # Public pages: static text for readers without JavaScript, the plain
    # shell when a page has no static form.
    location ~ ^/(?:(?:ru|zh)/)?(?:about|features|for-brands|download(?:/(?:octoprint|print-farm|edge))?)$ {
        try_files $uri $filamenthub_static_root$filamenthub_static_page/index.html $filamenthub_spa_index =404;
        expires -1;
    }

    # The static forms are reachable only through the public routes above.
    location ^~ /_pages/ {
        internal;
    }

    location ~ ^/(?:(?:ru|zh)/)?(?:profile|demo|calculator|feedback/[^./]+|workspace|admin|embed(?:/catalog)?|user-agreement|privacy-policy|personal-data-consent|reset-password|confirm-email-change|brand-invite/[^./]+|oauth/callback/[^./]+|oauth/plugin-start/[^./]+|quote/[^./]+)$ {
        try_files $uri $filamenthub_spa_index =404;
        expires -1;
    }

    location / {
        error_page 404 =404 /index.html;
        try_files $uri $uri/ =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp4|webm|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
}
