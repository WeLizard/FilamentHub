# Stable locale URLs use one SPA bundle with a localized static HTML shell.
# The query-string rules keep existing ?lng= links (notably OrcaSlicer embeds)
# working, while an explicit /en, /ru or /zh path always wins.
map "$uri|$arg_lng" $filamenthub_spa_index {
    ~^/en(?:/|$) /index.en.html;
    ~^/ru(?:/|$) /index.ru.html;
    ~^/zh(?:/|$) /index.zh.html;
    ~^[^|]*\|en$ /index.en.html;
    ~^[^|]*\|ru$ /index.ru.html;
    ~^[^|]*\|zh$ /index.zh.html;
    default /index.x-default.html;
}

map $request_uri $filamenthub_canonical_path {
    ~^(?<filamenthub_request_path>[^?]*) $filamenthub_request_path;
}

map $request_uri $filamenthub_base_path {
    ~^/(?:en|ru|zh)(?<filamenthub_unprefixed_path>/[^?]*) $filamenthub_unprefixed_path;
    ~^/(?:en|ru|zh)/?(?:\?|$) /;
    ~^(?<filamenthub_default_path>[^?]*) $filamenthub_default_path;
}

map $request_uri $filamenthub_robots_tag {
    default "";
    ~^/(?:(?:en|ru|zh)/)?(?:profile|calculator|workspace|admin)(?:/|\?|$) "noindex, nofollow";
    ~^/(?:(?:en|ru|zh)/)?(?:feedback/|quote/|reset-password|confirm-email-change|brand-invite/|oauth/|embed(?:/|\?|$)) "noindex, nofollow";
}

# HTTP server - редирект на HTTPS
server {
    listen 80;
    server_name filamenthub.ru www.filamenthub.ru _;
    access_log off;
    error_log /dev/stderr warn;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Редирект всего остального на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name filamenthub.ru www.filamenthub.ru;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    error_log /dev/stderr warn;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/filamenthub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filamenthub.ru/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Max upload size (соответствует MAX_UPLOAD_SIZE_MB бэкенда)
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag $filamenthub_robots_tag always;
    # script-src: no unsafe-inline/unsafe-eval — Vite build emits external scripts only,
    # JSON-LD blocks are non-executable, bundles contain no eval/new Function
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://filamenthub.ru https://api.github.com https://www.googleapis.com https://www.google.com/recaptcha/; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; frame-ancestors 'self';" always;

    # The build emits route placeholders in localized HTML. nginx resolves them
    # before sending the response, so canonical/hreflang are correct even when a
    # crawler does not execute the React application.
    sub_filter '__FH_CANONICAL_PATH__' '$filamenthub_canonical_path';
    sub_filter '__FH_BASE_PATH__' '$filamenthub_base_path';
    sub_filter_once off;

    # Sitemap и robots.txt прокси на бэкенд
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health checks (backend root endpoint)
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Compatibility alias for monitors that use /api/health
    location = /api/health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API proxy to backend
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Dedicated single-value header for request-scoped auth policy. Always
        # overwritten here; backend never trusts client-supplied X-Forwarded-For.
        proxy_set_header X-FilamentHub-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;

        # Larger buffers to avoid spilling API responses to disk
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # Spool compat proxy (clean path for Moonraker/HH integration)
    # Moonraker config: server: https://filamenthub.ru/spool_compat/{api_key}
    location /spool_compat {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
    }

    # Uploads proxy to backend
    location ^~ /uploads {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # QR codes proxy to backend
    location ^~ /qr_codes {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Distributions proxy to backend (for OrcaSlicer downloads)
    location ^~ /distributions {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # Longer timeout for large file downloads
        proxy_buffering off;  # Disable buffering for large files
    }

    # Wiki content (images for wiki articles)
    # ^~ означает: если prefix совпал, не проверять regex locations
    location ^~ /wiki_content {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Embed route for the OrcaSlicer plugin: serves the SPA but framable from the
    # plugin's file:// WebView. add_header inside a location drops inherited
    # headers, so the security headers are re-declared here minus X-Frame-Options.
    # Only the same site and a local file:// Orca plugin shell may frame this route.
    location ~ ^/(?:(?:en|ru|zh)/)?embed(?:/catalog)?/?$ {
        # Serve index.html IN PLACE (=404 form) so this location's relaxed framing
        # headers apply. A bare `try_files $uri /index.html;` internally redirects to
        # `location /`, which re-applies the server-level X-Frame-Options and blocks
        # the plugin iframe.
        try_files $uri $filamenthub_spa_index =404;
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # frame-ancestors: the Orca plugin shell cannot be a file:// document —
        # WebView2 SetPage pages get an opaque (null) origin, so the plugin
        # serves its shell from a loopback-only HTTP server instead. Loopback
        # parents are allowed; arbitrary remote sites still cannot frame us.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://filamenthub.ru https://api.github.com https://www.googleapis.com https://www.google.com/recaptcha/; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; frame-ancestors 'self' file: http://127.0.0.1:* http://localhost:*;" always;
    }

    # Serve the SPA only for routes that actually exist in React Router. A catch-all
    # fallback would turn every missing page/file into a soft 404 with HTTP 200.
    location = / {
        try_files $filamenthub_spa_index =404;
        expires -1;
    }

    location ~ ^/(?:en|ru|zh)/?$ {
        try_files $filamenthub_spa_index =404;
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    # Legacy crawlers still request this conventional path even when the page
    # declares the adaptive SVG icon explicitly.
    location = /favicon.ico {
        return 302 /favicon.svg?v=5;
    }

    location ~ ^/(?:(?:en|ru|zh)/)?(?:filaments/[^./]+|brands/[^./]+|profile|calculator|feedback/[^./]+|workspace|admin|download|wiki(?:/articles/[^./]+|/[^./]+)?|user-agreement|privacy-policy|personal-data-consent|reset-password|confirm-email-change|brand-invite/[^./]+|oauth/callback/[^./]+|oauth/plugin-start/[^./]+|quote/[^./]+)/?$ {
        try_files $uri $filamenthub_spa_index =404;
        expires -1;
    }

    # Serve real static files and return a real 404 for every unknown URL.
    location / {
        error_page 404 =404 /index.html;
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp4|webm|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
