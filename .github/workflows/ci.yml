name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  operations-scripts:
    name: Operations scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Bash deployment worker
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/run-deploy-job.sh
          bash -n backend/docker-entrypoint.sh

      - name: Check deployment resilience contract
        run: |
          python -m pytest scripts/tests/test_deploy_resilience_contract.py
          bash scripts/tests/test_run_deploy_job.sh

      - name: Check PowerShell owner scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            'scripts/check_tools.ps1',
            'scripts/deploy-server.ps1',
            'scripts/publish-plugin-release.ps1',
            'scripts/publish-plugin-releases.ps1',
            'scripts/start.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install system deps for weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app

      - name: Run tests (pytest, in-memory SQLite)
        run: pytest --no-cov-on-fail
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "false"
          REDIS_URL: "memory://"

  frontend:
    name: Frontend (type-check + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check + production build
        run: npm run build

      - name: Tests (vitest)
        run: npm test

  plugins:
    name: Plugins (tests + package build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            orca-plugin/pyproject.toml
            octoprint-plugin/pyproject.toml

      - name: Install packaging tools
        run: python -m pip install build pytest "OctoPrint==1.11.8"

      - name: Test OctoPrint bridge
        run: python -m pytest octoprint-plugin/tests
        env:
          PYTHONPATH: octoprint-plugin

      - name: Test OrcaSlicer plugin
        run: >-
          python -m pytest
          scripts/tests/test_release_workflow_contract.py
          scripts/tests/test_render_plugin_release_notes.py
          orca-plugin/tests
        env:
          PYTHONPATH: orca-plugin

      - name: Build OrcaSlicer plugin
        run: python orca-plugin/build_package.py --output "$RUNNER_TEMP/plugins/orca"

      - name: Build OctoPrint bridge
        run: python -m build --wheel --sdist --outdir "$RUNNER_TEMP/plugins/octoprint" octoprint-plugin
