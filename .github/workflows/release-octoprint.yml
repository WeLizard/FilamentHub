name: Release FilamentHub Bridge for OctoPrint

on:
  push:
    tags:
      - 'octoprint-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag, for example octoprint-v0.1.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-octoprint-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: octoprint-plugin/pyproject.toml

      - name: Install test and packaging tools
        run: python -m pip install build pytest "OctoPrint==1.11.8"

      - name: Verify tag and plugin version
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("octoprint-plugin/pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]

          source = Path("octoprint-plugin/octoprint_filamenthub_bridge/__init__.py")
          module = ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
          runtime_version = None
          for node in module.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == "PLUGIN_VERSION" for target in node.targets):
                  if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                      runtime_version = node.value.value
                      break

          if package_version != runtime_version:
              raise SystemExit(
                  f"Bridge versions differ: package={package_version!r}, runtime={runtime_version!r}"
              )
          if re.fullmatch(r"\d+\.\d+\.\d+", package_version) is None:
              raise SystemExit("A numeric Bridge version is required")

          expected_tag = f"octoprint-v{package_version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match plugin version; expected {expected_tag!r}"
              )
          PY

      - name: Test FilamentHub Bridge
        run: python -m pytest octoprint-plugin/tests
        env:
          PYTHONPATH: octoprint-plugin

      - name: Build package and release notes
        run: |
          python -m build --wheel --sdist --outdir "$RUNNER_TEMP/release/package" octoprint-plugin
          python scripts/render_plugin_release_notes.py \
            --component bridge \
            --output "$RUNNER_TEMP/release/RELEASE_NOTES.md"

      - name: Collect release assets and checksums
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release/assets"
          cp "$RUNNER_TEMP"/release/package/octoprint_filamenthubbridge-* \
            "$RUNNER_TEMP/release/assets/"
          cd "$RUNNER_TEMP/release/assets"
          test "$(find . -maxdepth 1 -name 'octoprint_filamenthubbridge-*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'octoprint_filamenthubbridge-*.tar.gz' | wc -l)" -eq 1
          sha256sum ./octoprint_filamenthubbridge-* > SHA256SUMS

      - name: Prepare draft release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; use a new version instead." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FilamentHub Bridge ${RELEASE_TAG#octoprint-v}" \
              --notes-file "$RUNNER_TEMP/release/RELEASE_NOTES.md" \
              --draft
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release/RELEASE_NOTES.md"

      - name: Upload Bridge package
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release/assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish tag-triggered release
        if: github.event_name == 'push'
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
