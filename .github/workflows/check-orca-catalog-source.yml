name: Orca catalog source freshness

on:
  schedule:
    # Weekly: upstream profile changes arrive in batches, and a daily red check
    # stops being read as a signal.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compare tracked profiles with OrcaSlicer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          set +e
          python scripts/check_orca_catalog_source.py --json | tee orca-catalog-freshness.json
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '## Orca catalog source'
            echo '```json'
            cat orca-catalog-freshness.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
