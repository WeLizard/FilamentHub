name: Release FilamentHub Edge

on:
  push:
    tags:
      - 'edge-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag, for example edge-v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-edge-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  EDGE_IMAGE: ghcr.io/welizard/filamenthub-edge
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate Edge release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: edge-agent/pyproject.toml

      - name: Install test tools
        run: python -m pip install -e edge-agent pytest ruff mypy PyYAML

      - name: Verify versions and release tag
        id: version
        shell: bash
        run: |
          python edge-agent/scripts/check_versions.py --tag "$RELEASE_TAG"
          echo "version=$(python edge-agent/scripts/check_versions.py --print-version)" \
            >> "$GITHUB_OUTPUT"

      - name: Lint, type-check and test
        run: |
          ruff check edge-agent/src edge-agent/tests edge-agent/scripts
          mypy edge-agent/src
          pytest edge-agent/tests

  smoke-images:
    name: Smoke ${{ matrix.ha_arch }} image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            docker_arch: amd64
            ha_arch: amd64
          - platform: linux/arm64
            docker_arch: arm64
            ha_arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build smoke image
        uses: docker/build-push-action@v7
        with:
          context: edge-agent
          platforms: ${{ matrix.platform }}
          load: true
          tags: filamenthub-edge:smoke-${{ matrix.ha_arch }}
          build-args: |
            BUILD_VERSION=${{ needs.validate.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}

      - name: Verify image contract and entrypoint
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_DOCKER_ARCH: ${{ matrix.docker_arch }}
          EXPECTED_HA_ARCH: ${{ matrix.ha_arch }}
          SMOKE_IMAGE: filamenthub-edge:smoke-${{ matrix.ha_arch }}
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' "$SMOKE_IMAGE")" \
            = "$EXPECTED_DOCKER_ARCH"
          test "$(docker image inspect --format '{{index .Config.Labels "io.hass.version"}}' "$SMOKE_IMAGE")" \
            = "$EXPECTED_VERSION"
          test "$(docker image inspect --format '{{index .Config.Labels "io.hass.arch"}}' "$SMOKE_IMAGE")" \
            = "$EXPECTED_HA_ARCH"
          docker run --rm "$SMOKE_IMAGE" --help

      - name: Verify Home Assistant storage and container lifecycle
        run: python3 edge-agent/scripts/smoke_image.py filamenthub-edge:smoke-${{ matrix.ha_arch }}

  publish-platforms:
    name: Publish ${{ matrix.ha_arch }} image
    needs: [validate, smoke-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            ha_arch: amd64
          - platform: linux/arm64
            ha_arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish architecture image
        uses: docker/build-push-action@v7
        with:
          context: edge-agent
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.EDGE_IMAGE }}:${{ needs.validate.outputs.version }}-${{ matrix.ha_arch }}
          build-args: |
            BUILD_VERSION=${{ needs.validate.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}

  publish-manifest:
    name: Publish multi-architecture manifest
    needs: [validate, publish-platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version and latest manifests
        shell: bash
        env:
          EDGE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$EDGE_IMAGE:$EDGE_VERSION" \
            --tag "$EDGE_IMAGE:latest" \
            "$EDGE_IMAGE:$EDGE_VERSION-amd64" \
            "$EDGE_IMAGE:$EDGE_VERSION-aarch64"
          docker buildx imagetools inspect "$EDGE_IMAGE:$EDGE_VERSION" --raw > manifest.json
          python - <<'PY'
          import json

          with open("manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          platforms = {
              (item.get("platform") or {}).get("architecture")
              for item in manifest.get("manifests", [])
          }
          expected = {"amd64", "arm64"}
          if platforms != expected:
              raise SystemExit(f"Unexpected Edge manifest platforms: {sorted(platforms)}")
          PY
