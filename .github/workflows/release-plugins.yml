name: Legacy plugin bundle release disabled

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: legacy-plugin-bundle-release-disabled
  cancel-in-progress: false

jobs:
  disabled:
    name: Use independent plugin releases
    runs-on: ubuntu-latest
    steps:
      - name: Stop legacy release
        shell: bash
        run: |
          echo "::error::Mixed plugins-v* releases are disabled. Run scripts/publish-plugin-releases.ps1 from the owner checkout."
          exit 1
