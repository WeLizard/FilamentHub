name: Release FilamentHub for OrcaSlicer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-filamenthub-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orca-plugin/pyproject.toml

      - name: Install test and packaging tools
        run: python -m pip install build pytest

      - name: Verify tag and plugin version
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          source = Path("orca-plugin/filamenthub_plugin.py")
          module = ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
          version = None
          for node in module.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == "PLUGIN_VERSION" for target in node.targets):
                  if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                      version = node.value.value
                      break
          if version is None or re.fullmatch(r"\d+\.\d+\.\d+", version) is None:
              raise SystemExit("A valid numeric PLUGIN_VERSION is required")

          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match plugin version; expected {expected_tag!r}"
              )
          PY

      - name: Test FilamentHub plugin
        run: >-
          python -m pytest
          scripts/tests/test_release_workflow_contract.py
          scripts/tests/test_render_plugin_release_notes.py
          orca-plugin/tests
        env:
          PYTHONPATH: orca-plugin

      - name: Build FilamentHub and release notes
        run: |
          python orca-plugin/build_package.py --output "$RUNNER_TEMP/release/filamenthub"
          python scripts/render_plugin_release_notes.py \
            --component orca \
            --output "$RUNNER_TEMP/release/RELEASE_NOTES.md"

      - name: Collect release assets and checksums
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release/assets"
          cp "$RUNNER_TEMP"/release/filamenthub/wheels/filamenthub-*.whl \
            "$RUNNER_TEMP/release/assets/"
          cd "$RUNNER_TEMP/release/assets"
          test "$(find . -maxdepth 1 -name 'filamenthub-*.whl' | wc -l)" -eq 1
          sha256sum ./filamenthub-*.whl > SHA256SUMS

      - name: Prepare draft release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; use a new version instead." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FilamentHub ${RELEASE_TAG#v}" \
              --notes-file "$RUNNER_TEMP/release/RELEASE_NOTES.md" \
              --draft
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release/RELEASE_NOTES.md"

      - name: Upload FilamentHub package
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release/assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
