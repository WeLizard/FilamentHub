# Install after Happy Hare includes. Requires Happy Hare 4.2 gate-map callbacks.
# This wrapper protects the ASYNCHRONOUS apply, not just the refresh request.
[gcode_macro FH_EDGE_REFRESH]
description: Safely refresh the Happy Hare pull map from its configured Spoolman
variable_guard_version: 1
variable_requested: 0
variable_applied: 0
variable_deferred: 0
variable_last_map: ""
gcode:
    {% set mmu = printer.mmu %}
    {% set safe = mmu.enabled == true and printer.print_stats.state in ['standby', 'complete', 'cancelled', 'error'] and printer.pause_resume.is_paused == false and printer.idle_timeout.state in ['Idle', 'Ready'] and mmu.print_state in ['standby', 'complete', 'cancelled', 'error', 'ready', 'initialized'] and mmu.is_paused == false %}
    {% if mmu.spoolman_support == 'pull' and safe %}
        SET_GCODE_VARIABLE MACRO=FH_EDGE_REFRESH VARIABLE=requested VALUE={requested + 1}
        MMU_SPOOLMAN REFRESH=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=FH_EDGE_REFRESH VARIABLE=deferred VALUE={deferred + 1}
        {action_respond_info('FilamentHub refresh deferred: printer is busy, unknown or not in pull mode')}
    {% endif %}

[gcode_macro MMU_GATE_MAP]
rename_existing: _FH_ORIGINAL_MMU_GATE_MAP
variable_guard_version: 1
description: Guard asynchronous Spoolman pull-map replacement while printing
gcode:
    {% set mmu = printer.mmu %}
    {% set replace = 'MAP' in params and params.REPLACE|default('0')|int == 1 and params.FROM_SPOOLMAN|default('0')|int == 1 %}
    {% set safe = mmu.enabled == true and printer.print_stats.state in ['standby', 'complete', 'cancelled', 'error'] and printer.pause_resume.is_paused == false and printer.idle_timeout.state in ['Idle', 'Ready'] and mmu.print_state in ['standby', 'complete', 'cancelled', 'error', 'ready', 'initialized'] and mmu.is_paused == false %}
    {% set guard = printer['gcode_macro FH_EDGE_REFRESH'] %}
    {% if replace %}
        {% if safe and mmu.spoolman_support == 'pull' %}
            _FH_ORIGINAL_MMU_GATE_MAP {rawparams}
            SET_GCODE_VARIABLE MACRO=FH_EDGE_REFRESH VARIABLE=last_map VALUE='{params.MAP|tojson}'
            SET_GCODE_VARIABLE MACRO=FH_EDGE_REFRESH VARIABLE=applied VALUE={guard.applied + 1}
        {% else %}
            SET_GCODE_VARIABLE MACRO=FH_EDGE_REFRESH VARIABLE=deferred VALUE={guard.deferred + 1}
            {action_respond_info('FilamentHub pull-map apply deferred until the printer is idle')}
        {% endif %}
    {% else %}
        _FH_ORIGINAL_MMU_GATE_MAP {rawparams}
    {% endif %}
