configuration:
  filamenthub_url:
    name: Адрес FilamentHub
    description: Облачный адрес для защищённой синхронизации Edge.
  connections:
    name: Принтеры
    description: По одной записи на принтер. Добавляйте принтеры в эту же установку Edge; после сохранения перезапустите приложение.
    fields:
      auto_refresh:
        name: Обновлять назначения Happy Hare
        description: По умолчанию выключено. Нужны режим pull и ручная установка защиты Klipper; при печати и паузе изменения ожидают.
      id:
        name: Идентификатор подключения
        description: Уникальное имя из строчных латинских букв, цифр, дефиса и подчёркивания. Не меняйте после подключения — оно связано с сохранённым состоянием принтера.
      name:
        name: Название
        description: Понятное вам название принтера.
      enabled:
        name: Включено
        description: Выключите для паузы только этого подключения. По умолчанию включено; очередь событий сохраняется.
      adapter:
        name: Адаптер
        description: moonraker — принтеры на Klipper; flashforge — Flashforge Adventurer 5M / 5M Pro, AD5X и Creator 5 / 5 Pro в режиме LAN; bambu — принтеры Bambu Lab; sdcp — принтеры на протоколе SDCP, например Elegoo Centauri Carbon; elegoo_mqtt — Elegoo Centauri Carbon 2. Если не указан, используется moonraker.
      pairing_code:
        name: Код подключения
        description: Одноразовый код из FilamentHub для этого принтера. Удалите код после успешного подключения.
      material_provider:
        name: Система подачи
        description: happy_hare — MMU Happy Hare; legacy — прямая подача Klipper; flashforge, bambu, sdcp и elegoo_mqtt выбираются автоматически для одноимённых адаптеров.
      moonraker_url:
        name: Адрес Moonraker
        description: Локальный HTTP(S)-адрес принтера, доступный из HA, например http://192.168.1.20:7125. Не адрес самого HA.
      printer_url:
        name: Адрес принтера
        description: "Локальный адрес принтера, доступный из HA. Flashforge: например http://192.168.1.40 (если порт не указан, используется 8898). Bambu Lab, SDCP и Elegoo Centauri Carbon 2: только IP-адрес, например 192.168.1.50."
      serial_number:
        name: Серийный номер
        description: Для Flashforge и Bambu Lab. Серийный номер из настроек принтера.
      check_code:
        name: Код проверки
        description: Только для Flashforge. Показывается на экране сети принтера после включения режима LAN; в FilamentHub не отправляется.
      access_code:
        name: Код доступа
        description: Bambu Lab и Elegoo Centauri Carbon 2. Показывается на экране принтера; для Centauri Carbon 2 можно не указывать, если код не меняли. В FilamentHub не отправляется.
      moonraker_api_key:
        name: API-ключ Moonraker
        description: Необязательный локальный ключ; он не отправляется в FilamentHub.
      sync_interval:
        name: Интервал этого принтера
        description: От 15 до 3600 секунд. Если не указан, используется общий интервал.
  sync_interval:
    name: Интервал синхронизации
    description: Число секунд между успешными циклами синхронизации.
  allow_insecure_cloud:
    name: Разрешить HTTP для облака
    description: Только для разработки. В production FilamentHub оставьте выключенным.
