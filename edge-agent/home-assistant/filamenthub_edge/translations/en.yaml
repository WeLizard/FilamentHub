configuration:
  filamenthub_url:
    name: FilamentHub address
    description: Cloud address used for secure Edge synchronization.
  connections:
    name: Printers
    description: One entry per printer. Add printers to this same Edge installation; restart the app after saving changes.
    fields:
      id:
        name: Connection ID
        description: A unique lowercase slug using letters, digits, hyphens and underscores. Keep it unchanged after pairing; it identifies the printer's saved state.
      name:
        name: Name
        description: A recognizable name for this printer.
      enabled:
        name: Enabled
        description: Disable to pause only this connection. Enabled by default; queued events are preserved.
      auto_refresh:
        name: Refresh Happy Hare assignments
        description: Disabled by default. Requires pull mode and manual installation of the Klipper guard; changes wait while printing or paused.
      adapter:
        name: Adapter
        description: moonraker for Klipper printers; flashforge for Flashforge Adventurer 5M / 5M Pro, AD5X and Creator 5 / 5 Pro in LAN mode; bambu for Bambu Lab printers; anycubic for Anycubic Kobra 3, S1 and X in LAN mode. Defaults to moonraker.
      pairing_code:
        name: Pairing code
        description: One-time code from FilamentHub for this printer. Remove it after successful pairing.
      material_provider:
        name: Material system
        description: happy_hare for a Happy Hare MMU; legacy for direct Klipper feed; flashforge, bambu and anycubic are set automatically for the adapters of the same name.
      moonraker_url:
        name: Moonraker address
        description: The printer's local HTTP(S) address reachable from HA, for example http://192.168.1.20:7125. Not the HA address.
      printer_url:
        name: Printer address
        description: "The printer's local address reachable from HA. Flashforge: for example http://192.168.1.40 (port 8898 is used when omitted). Bambu Lab and Anycubic: the IP address alone, for example 192.168.1.50."
      serial_number:
        name: Serial number
        description: Flashforge and Bambu Lab. The serial number shown in the printer's settings.
      check_code:
        name: Check code
        description: Flashforge only. Shown on the printer's network screen after enabling LAN mode; it is never sent to FilamentHub.
      access_code:
        name: Access code
        description: Bambu Lab only. Shown on the printer's screen in the network settings; it is never sent to FilamentHub.
      moonraker_api_key:
        name: Moonraker API key
        description: Optional local API key; it is never sent to FilamentHub.
      sync_interval:
        name: Printer sync interval
        description: From 15 to 3600 seconds. Uses the shared interval when omitted.
  sync_interval:
    name: Sync interval
    description: Seconds between successful synchronization cycles.
  allow_insecure_cloud:
    name: Allow HTTP cloud
    description: Development only. Keep disabled for FilamentHub production.
