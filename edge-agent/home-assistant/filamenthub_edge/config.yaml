name: FilamentHub Edge
version: 0.1.0
slug: filamenthub_edge
description: Secure local printer and spool synchronization with FilamentHub
url: https://filamenthub.ru
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: experimental
init: false
timeout: 210
backup: cold
image: ghcr.io/welizard/filamenthub-edge
options:
  filamenthub_url: https://filamenthub.ru
  connections: []
  sync_interval: 30
  allow_insecure_cloud: false
schema:
  filamenthub_url: url
  connections:
    - id: match(^[a-z0-9][a-z0-9_-]{0,63}$)
      name: str?
      enabled: bool?
      adapter: list(moonraker)?
      pairing_code: password?
      material_provider: list(happy_hare|legacy)
      moonraker_url: url
      moonraker_api_key: password?
      sync_interval: int(15,3600)?
  sync_interval: int(15,3600)
  allow_insecure_cloud: bool
