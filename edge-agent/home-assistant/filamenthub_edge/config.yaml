name: FilamentHub Edge
version: 0.1.0
slug: filamenthub_edge
description: Принтеры и катушки ↔ FilamentHub / Printer & spool bridge / 打印机与料盘桥接
url: https://filamenthub.ru
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: experimental
init: false
timeout: 210
backup: cold
image: ghcr.io/welizard/filamenthub-edge
options:
  filamenthub_url: https://filamenthub.ru
  connections: []
  sync_interval: 30
  allow_insecure_cloud: false
schema:
  filamenthub_url: url
  connections:
    - id: match(^[a-z0-9][a-z0-9_-]{0,63}$)
      name: str?
      enabled: bool?
      adapter: list(moonraker|flashforge|bambu|sdcp|elegoo_mqtt|anycubic)?
      pairing_code: password?
      material_provider: list(happy_hare|legacy|flashforge|bambu|sdcp|elegoo_mqtt|anycubic)?
      moonraker_url: url?
      printer_url: str?
      serial_number: str?
      check_code: password?
      access_code: password?
      moonraker_api_key: password?
      sync_interval: int(15,3600)?
      auto_refresh: bool?
  sync_interval: int(15,3600)
  allow_insecure_cloud: bool
