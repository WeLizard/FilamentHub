<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#0f172a;font-family:system-ui,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f172a;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#1e293b;border-radius:16px;border:1px solid rgba(255,255,255,0.1);overflow:hidden;">
          <tr>
            <td style="padding:32px;">
              <div style="margin:0 0 18px;font-size:16px;font-weight:600;letter-spacing:0.3px;color:#a78bfa;">
                Filament<span style="color:#34d399;">Hub</span>
              </div>
              <div style="color:#cbd5e1;font-size:15px;line-height:1.65;">
                {% if body_html %}
                  {{ body_html }}
                {% else %}
                  <div style="white-space:pre-wrap;">{{ body }}</div>
                {% endif %}
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;border-top:1px solid rgba(255,255,255,0.08);color:#64748b;font-size:12px;line-height:1.5;">
              Ответ отправлен командой FilamentHub · {{ contact_email }}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
