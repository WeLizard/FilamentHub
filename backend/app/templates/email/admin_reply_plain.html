<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;color:#1f2937;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">
  <div style="max-width:640px;margin:0 auto;padding:24px 20px;font-size:15px;line-height:1.6;">
    {% if body_html %}
      {{ body_html }}
    {% else %}
      <div style="white-space:pre-wrap;">{{ body }}</div>
    {% endif %}
    <div style="margin-top:28px;color:#6b7280;font-size:13px;line-height:1.5;">
      FilamentHub · {{ contact_email }}
    </div>
  </div>
</body>
</html>
