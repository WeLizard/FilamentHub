{% macro action_button(url, label) %}
<table cellpadding="0" cellspacing="0" style="margin:0 auto 24px;">
  <tr>
    <td style="background:linear-gradient(135deg,#7c3aed,#db2777);border-radius:10px;">
      <a href="{{ url }}" style="display:inline-block;padding:14px 32px;color:#fff;font-weight:600;font-size:15px;text-decoration:none;">
        {{ label }}
      </a>
    </td>
  </tr>
</table>
{% endmacro %}

{% macro link_fallback(url) %}
<p style="margin:0;color:#475569;font-size:12px;word-break:break-all;">
  {{ url }}
</p>
{% endmacro %}
