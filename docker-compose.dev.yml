services:
  # The development stack is held inside the production machine's envelope: two
  # cores and its share of four gigabytes, with the three services pinned to the
  # same pair of cores so they compete for them exactly as they do on the server.
  # A workstation with sixteen cores would otherwise make every measurement taken
  # here a pleasant fiction.
  postgres-dev:
    image: postgres:15-alpine
    container_name: filamenthub_postgres_dev
    restart: unless-stopped
    command: postgres -c max_connections=200 -c log_checkpoints=off -c log_min_messages=warning
    cpuset: "0,1"
    mem_limit: 1g
    environment:
      POSTGRES_DB: filamenthub_dev
      POSTGRES_USER: filamenthub
      POSTGRES_PASSWORD: devpass123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filamenthub -d filamenthub_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - filamenthub_dev

  redis-dev:
    image: redis:7-alpine
    container_name: filamenthub_redis_dev
    restart: unless-stopped
    command: redis-server --requirepass devredis123
    cpuset: "0,1"
    mem_limit: 256m
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devredis123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - filamenthub_dev

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filamenthub_backend_dev
    restart: unless-stopped
    cpuset: "0,1"
    mem_limit: 2g
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    # Auto-apply migrations on dev startup, then run the reload server. Replaces the
    # admin-panel apply path (removed with the other raw-DB tools). Dev-only — prod
    # keeps its deliberate manual-migration practice.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-dev
      POSTGRES_PORT: 5432
      POSTGRES_USER: filamenthub
      POSTGRES_PASSWORD: devpass123
      POSTGRES_DB: filamenthub_dev
      REDIS_URL: redis://:devredis123@redis-dev:6379/0
      SECRET_KEY: dev-secret-key-not-for-production
      ADMIN_PASSWORD: admin123
      DEBUG: "true"
      AUTH_REGION_MODE: development
      LOG_LEVEL: DEBUG
      AUTH_WEB_MODE: dual
      AUTH_COOKIE_SAMESITE: lax
      AUTH_COOKIE_SECURE: "false"
      # Dev only: trust the client-IP header from anywhere, so a load rehearsal
      # can present each simulated visitor as its own address and exercise the
      # per-visitor rate limits instead of piling into one shared counter.
      # Production keeps this pinned to the frontend proxy.
      AUTH_TRUSTED_PROXY_NETWORKS: 0.0.0.0/0
      # Production runs four workers, each allowing two password checks at once.
      # Reload mode forces a single worker here, so the whole allowance is given
      # to it — otherwise dev would refuse a crowd four times sooner than the
      # server does.
      PASSWORD_HASH_CONCURRENCY: 8
    networks:
      - filamenthub_dev

  frontend-dev:
    image: node:20-alpine
    container_name: filamenthub_frontend_dev
    restart: unless-stopped
    # Kept off the mirrored pair: production serves the built site from nginx and
    # has no bundler running, so letting one compete for those cores here would
    # tax every measurement with work the server never does.
    cpuset: "2,3"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8001
      VITE_PROXY_TARGET: http://backend-dev:8000
      VITE_RECAPTCHA_SITE_KEY: ""
      VITE_AUTH_WEB_MODE: dual
      VITE_AUTH_CSRF_HEADER_NAME: X-CSRF-Token
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend-dev:
        condition: service_healthy
    networks:
      - filamenthub_dev

volumes:
  postgres_dev_data:

networks:
  filamenthub_dev:
    driver: bridge
